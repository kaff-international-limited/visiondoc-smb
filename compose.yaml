name: visiondoc-smb-prod
services:
  importer:
    image: visiondoc-smb:prod${IMAGE_SUFFIX:-}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UI_PORT:-8787}:8080"
    volumes:
      - state:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
volumes:
  state:
